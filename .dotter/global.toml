[helpers]

[bash]
depends = ["shell"]

[bash.files]
bashrc = "~/.bashrc"

[fish]
depends = ["shell"]

[fish.files]
fish = "~/.config/fish"

[shell.variables]
editor = "/usr/bin/nvim"
terminal = "" # set by local.toml
shell = "/usr/bin/fish"

[nvim.files]
nvim = "~/.config/nvim"

[xdg.files]
xdg = "~/.config"

[sway]
depends = ["foot", "waybar"]

[sway.files]
sway = "~/.config/sway"

[waybar.files]
waybar = "~/.config/waybar"

[hyprland]
depends = ["foot", "waybar"]

[hyprland.files]
hyprland = "~/.config/hypr"

[i3.files]
i3 = "~/.config/i3"
i3status = "~/.config/i3status/config"

[x.files]
xprofile = "~/.xprofile"

[foot]
depends = ["shell"]

[foot.files]
foot = "~/.config/foot/"

[alacritty]
depends = ["shell"]

[alacritty.files]
alacritty = "~/.config/alacritty"

[settings]
default_target_type = "automatic"

[zathura.files]
zathurarc = "~/.config/zathura"

[R.files]
Renviron = "~/.Renviron"
